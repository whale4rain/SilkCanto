# 零 Token 确定性去 AI 味 Linter（表层禁词 + 深层 AI 指纹检测）
limits:
  min_chars: 1850
  max_chars: 2850
  min_dialogue_ratio: 0.18
  max_staged_dialogue_ratio: 0.62
  max_paragraph_chars: 120
  max_long_paragraphs: 3
  max_em_dash_count: 3
  max_not_but_count: 2
  max_cliche_total: 3
  max_single_cliche: 1
  max_force_adverbs: 5
  max_body_cliches: 2

# 绝对禁止的 AI 讲义腔 / 总结陈词 / 本质拔高壳
banned_phrases:
  - 总而言之
  - 总的来说
  - 值得注意的是
  - 不可否认的是
  - 毋庸置疑
  - 换句话说
  - 综上所述
  - 由此可见
  - 不难发现
  - 显而易见的是
  - 从某种意义上说
  - 某种程度上来说
  - 正如前文所述
  - 这不仅意味着
  - 不仅如此，更
  - 归根结底
  - 本质上来说
  - 核心在于
  - 无不昭示着
  - 仿佛冥冥之中
  - 空气中弥漫着
  - 命运的齿轮开始转动
  - 故事才刚刚开始
  - 一场风暴正在酝酿
  - 恐怖如斯

# 高频 AI 网文套话
cliche_phrases:
  - 眼神微眯
  - 嘴角勾起一抹
  - 空气仿佛凝固
  - 倒吸一口凉气
  - 眼中闪过一丝
  - 眼神中闪过一丝
  - 深吸了一口气
  - 不由自主地
  - 内心掀起惊涛骇浪
  - 浑身一震
  - 死死盯着
  - 瞳孔骤缩
  - 脸色瞬间阴沉
  - 淡淡一笑
  - 嗤笑一声
  - 不可置信
  - 泛起一丝涟漪
  - 宛如
  - 犹如
  - 吐字如铁
  - 透着一股
  - 字字咬得

# 深层 AI 指纹 1：暴力剧烈副词（用力过猛）
force_adverbs:
  - 猛地
  - 死死
  - 狠狠
  - 骤然
  - 陡然
  - 轰然
  - 硬生生
  - 斩钉截铁

# 深层 AI 指纹 2：AI 生理广播体操词（舞台剧症候群）
body_cliches:
  - 喉结
  - 眼皮狂跳
  - 后槽牙
  - 喉咙发干
  - 浑身一僵
  - 鼻腔发酸
  - 彻底懵了
  - 咽了口
  - 一怔
