name: dafeng_mystery
display_name: 架空高武王朝 × 现代专业降维探案 × 轻喜剧爽文（双步 Deslop 去AI味版）
platform: fanqie
genre: 架空高武悬疑爽文
description: >-
  基于《大奉打更人》前10章拆书基因 + 独立 Deslop 口语化洗稿步 + 深层 AI 指纹 Linter 的实战配方。
  强调松弛的活人感、极简裸对白交锋、现代专业常识降维打击超凡盲区与手机端短段节奏。

targets:
  target_chapters_for_contract: 10
  chapter_min_chars: 1950
  chapter_max_chars: 2550
  opening_race_variants: 3
  max_rewrite_retries: 2
  critic_pass_score: 7.0

style_guide:
  pov: 第三人称限知视角（紧贴主角，严守 reader_known 信息边界）
  pacing: 开局自然带出困境与倒计时，允许穿插少量松弛活人吐槽；章末停在冲突动作或反问上
  paragraph_style: 手机端短段与中段错落（均段25-65字，最长不超过120字），大量直接裸对白，少副词、多白描
  forbidden_habits:
    - 严禁对话前高频堆砌“喉结滚动/眼皮狂跳/咬紧后槽牙/浑身一僵”等舞台剧广播体操
    - 严禁满屏“猛地/死死/狠狠/骤然/轰然”等暴力副词过载
    - 严禁把现代专业术语（如物理账面、交叉稽核）直接说给古代配角听
    - 严禁在动作或细节后替读者写“心理说明书”或上帝视角解说旁白
    - 严禁章末抒情鸡汤或预告片口号式金句

models:
  deconstruct: ""
  foundation: ""
  beat: ""
  draft: ""
  deslop: ""
  critic: ""
  commit: ""

temperatures:
